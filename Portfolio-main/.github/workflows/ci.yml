name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify index.html exists
        run: |
          if [ ! -f Portfolio-main/index.html ]; then
            echo "index.html not found inside Portfolio-main!"
            exit 1
          fi
          echo "index.html exists."

      - name: Verify assets folder exists
        run: |
          if [ ! -d Portfolio-main/assets ]; then
            echo "assets folder not found inside Portfolio-main!"
            exit 1
          fi
          echo "assets folder exists."

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-artifact
          path: |
            Portfolio-main/index.html
            Portfolio-main/assets/
